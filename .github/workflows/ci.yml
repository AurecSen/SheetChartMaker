name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'raia/**'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Show environment
        run: |
          node --version
          npm --version
          npm config get production

      - name: Install dependencies
        run: npm install --include=dev

      - name: List installed build packages
        run: |
          npm ls vite typescript react react-dom @vitejs/plugin-react vitest --depth=0

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build
